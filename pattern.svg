<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <!-- Row 1: upward triangles alternating dark maroon + coral -->
  <polygon points="0,16 8,0 16,16"   fill="#7b2d42"/>
  <polygon points="16,16 24,0 32,16"  fill="#c97b5a"/>
  <polygon points="32,16 40,0 48,16"  fill="#7b2d42"/>
  <polygon points="48,16 56,0 64,16"  fill="#c97b5a"/>
  <polygon points="64,16 72,0 80,16"  fill="#7b2d42"/>
  <polygon points="80,16 88,0 96,16"  fill="#c97b5a"/>
  <polygon points="96,16 104,0 112,16" fill="#7b2d42"/>
  <polygon points="112,16 120,0 128,16" fill="#c97b5a"/>

  <!-- Row 2: downward triangles (inverted), slightly smaller -->
  <polygon points="8,16 16,32 24,16"  fill="#c97b5a"/>
  <polygon points="24,16 32,32 40,16" fill="#7b2d42"/>
  <polygon points="40,16 48,32 56,16" fill="#c97b5a"/>
  <polygon points="56,16 64,32 72,16" fill="#7b2d42"/>
  <polygon points="72,16 80,32 88,16" fill="#c97b5a"/>
  <polygon points="88,16 96,32 104,16" fill="#7b2d42"/>
  <polygon points="104,16 112,32 120,16" fill="#c97b5a"/>

  <!-- Middle stripe: burgundy band -->
  <rect x="0" y="32" width="120" height="6" fill="#7b2d42"/>

  <!-- Dots row -->
  <circle cx="8"  cy="42" r="3.5" fill="#d4a0a0"/>
  <circle cx="20" cy="42" r="3.5" fill="#d4a0a0"/>
  <circle cx="32" cy="42" r="3.5" fill="#d4a0a0"/>
  <circle cx="44" cy="42" r="3.5" fill="#d4a0a0"/>
  <circle cx="56" cy="42" r="3.5" fill="#d4a0a0"/>
  <circle cx="68" cy="42" r="3.5" fill="#d4a0a0"/>
  <circle cx="80" cy="42" r="3.5" fill="#d4a0a0"/>
  <circle cx="92" cy="42" r="3.5" fill="#d4a0a0"/>
  <circle cx="104" cy="42" r="3.5" fill="#d4a0a0"/>
  <circle cx="116" cy="42" r="3.5" fill="#d4a0a0"/>

  <!-- Bottom stripe: burgundy band -->
  <rect x="0" y="48" width="120" height="6" fill="#7b2d42"/>

  <!-- Row 3: upward triangles -->
  <polygon points="0,54 8,70 16,54"   fill="#c97b5a"/>
  <polygon points="16,54 24,70 32,54"  fill="#7b2d42"/>
  <polygon points="32,54 40,70 48,54"  fill="#c97b5a"/>
  <polygon points="48,54 56,70 64,54"  fill="#7b2d42"/>
  <polygon points="64,54 72,70 80,54"  fill="#c97b5a"/>
  <polygon points="80,54 88,70 96,54"  fill="#7b2d42"/>
  <polygon points="96,54 104,70 112,54" fill="#c97b5a"/>
  <polygon points="112,54 120,70 128,54" fill="#7b2d42"/>

  <!-- Row 4: downward triangles -->
  <polygon points="8,70 16,54 24,70"  fill="#7b2d42"/>
  <polygon points="24,70 32,54 40,70" fill="#c97b5a"/>
  <polygon points="40,70 48,54 56,70" fill="#7b2d42"/>
  <polygon points="56,70 64,54 72,70" fill="#c97b5a"/>
  <polygon points="72,70 80,54 88,70" fill="#7b2d42"/>
  <polygon points="88,70 96,54 104,70" fill="#c97b5a"/>
  <polygon points="104,70 112,54 120,70" fill="#7b2d42"/>
</svg>
